name: Validate & publish leetcode-posts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/sync_skills.py --check
      - run: python -m pytest -q
      - run: python scripts/audit_svg.py
      - run: python scripts/build_site.py
      - run: python scripts/validate_site.py
      - name: Browser QA on all published posts
        run: python scripts/browser_check_all.py --workers 2
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-stix
      - name: Incremental PDF cache restore
        uses: actions/cache/restore@v4
        id: pdf-cache
        with:
          path: .pdf-cache
          key: leetcode-posts-pdf-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: leetcode-posts-pdf-v1-${{ runner.os }}-
      - name: Render and validate PDFs
        run: |
          python scripts/render_pdfs.py
          python scripts/validate_site.py --require-pdfs
      - name: Save PDF cache
        uses: actions/cache/save@v4
        with:
          path: .pdf-cache
          key: ${{ steps.pdf-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: reports/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
