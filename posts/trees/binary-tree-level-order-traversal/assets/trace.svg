<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">102 Binary Tree Level Order Traversal trace</title><desc id="d">开始处理某层时，队列恰好是这一层从左到右的所有节点。先保存当前队列长度 level_size，再恰好弹出这么多个节点；它们的孩子只会进入下一层。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="30" y="38" font-size="18" fill="#285e59">FREEZE THE CURRENT LEVEL SIZE</text><rect x="42" y="84" width="190" height="142" rx="12" fill="#e0eee7" stroke="#94b7aa"/><text x="137" y="115" text-anchor="middle" font-size="17" fill="#286d65">QUEUE</text><text x="137" y="160" text-anchor="middle" font-size="27" fill="#235c57">[9,20]</text><text x="137" y="196" text-anchor="middle" font-size="14" fill="#53736c">level_size = 2</text><path d="M250 154 H340 M327 143 L342 154 L327 165" stroke="#bf7954" stroke-width="4" fill="none"/><rect x="360" y="84" width="318" height="142" rx="12" fill="#f4e4d6" stroke="#d7aa88"/><text x="519" y="126" text-anchor="middle" font-size="18" fill="#98623f">THIS LEVEL</text><text x="519" y="169" text-anchor="middle" font-size="27" fill="#235c57">[9,20]</text></svg>
