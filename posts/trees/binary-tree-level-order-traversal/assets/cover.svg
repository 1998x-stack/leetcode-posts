<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">102 Binary Tree Level Order Traversal cover</title><desc id="d">开始处理某层时，队列恰好是这一层从左到右的所有节点。先保存当前队列长度 level_size，再恰好弹出这么多个节点；它们的孩子只会进入下一层。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="32" y="36" font-size="17" fill="#356d6b">TREE BFS · LEVEL BY LEVEL</text><path d="M360 92 L205 165 M360 92 L515 165 M515 193 L440 246 M515 193 L590 246" fill="none" stroke="#84aaa0" stroke-width="4"/><circle cx="360" cy="78" r="28" fill="#d4e9df" stroke="#78a69b" stroke-width="2"/><text x="360" y="85" text-anchor="middle" font-size="22" fill="#194c4c">3</text><circle cx="205" cy="165" r="28" fill="#d4e9df" stroke="#78a69b" stroke-width="2"/><text x="205" y="172" text-anchor="middle" font-size="22" fill="#194c4c">9</text><circle cx="515" cy="165" r="28" fill="#d4e9df" stroke="#78a69b" stroke-width="2"/><text x="515" y="172" text-anchor="middle" font-size="22" fill="#194c4c">20</text><circle cx="440" cy="246" r="28" fill="#f2d6c0" stroke="#78a69b" stroke-width="2"/><text x="440" y="253" text-anchor="middle" font-size="22" fill="#194c4c">15</text><circle cx="590" cy="246" r="28" fill="#f2d6c0" stroke="#78a69b" stroke-width="2"/><text x="590" y="253" text-anchor="middle" font-size="22" fill="#194c4c">7</text><text x="95" y="88" font-size="15" fill="#2b756d">L0</text><text x="95" y="174" font-size="15" fill="#2b756d">L1</text><text x="95" y="255" font-size="15" fill="#a15f3f">L2</text></svg>
