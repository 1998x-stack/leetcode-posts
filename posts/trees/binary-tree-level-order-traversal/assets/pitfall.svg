<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">102 Binary Tree Level Order Traversal pitfall</title><desc id="d">开始处理某层时，队列恰好是这一层从左到右的所有节点。先保存当前队列长度 level_size，再恰好弹出这么多个节点；它们的孩子只会进入下一层。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="32" y="42" font-size="19" fill="#315e59">A SMALL CONDITION CAN BREAK THE INVARIANT</text><rect x="35" y="86" width="310" height="122" rx="13" fill="#fae7dd" stroke="#d9ad90"/><rect x="375" y="86" width="310" height="122" rx="13" fill="#d9eee4" stroke="#9dc4b4"/><text x="190" y="137" text-anchor="middle" font-size="21" fill="#9a503a" font-weight="bold">循环直到队列清空</text><text x="530" y="137" text-anchor="middle" font-size="21" fill="#236b61" font-weight="bold">先冻结 level_size</text><text x="360" y="260" text-anchor="middle" font-size="16" fill="#58746e">先写清楚边界，再把条件放进代码</text></svg>
