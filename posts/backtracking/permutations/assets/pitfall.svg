<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">46 常见错误及正确不变量</title><desc id="d">如果使用 result.append(path) 而不复制，所有结果都会引用同一个不断变化的列表，回溯结束后看到的通常都是空列表。另一个常见错误是忘记撤销 used 标记，导致后续兄弟分支不可选。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="33" y="48" font-size="20" fill="#315e59" font-weight="bold">对照：哪一步会破坏不变量？</text><rect x="38" y="84" width="300" height="132" rx="14" fill="#fae8dd" stroke="#deae8c"/><rect x="382" y="84" width="300" height="132" rx="14" fill="#d7ede3" stroke="#9fc8b6"/><text x="188" y="143" text-anchor="middle" fill="#9a503a" font-size="21" font-weight="bold">错误：保存 path 引用</text><text x="532" y="143" text-anchor="middle" fill="#236c61" font-size="21" font-weight="bold">正确：保存 path.copy()</text><text x="360" y="263" font-size="15" text-anchor="middle" fill="#56746f">理解错误状态，才能知道优化为何成立</text></svg>
