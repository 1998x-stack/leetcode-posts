<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">46 关键状态转移</title><desc id="d">每一层依次尝试还未使用的数字：标记 used、放入 path、递归填下一位；返回后先移除 path 末项，再恢复 used。长度达到 n 时将 path.copy() 放进结果。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="36" y="46" font-size="20" font-weight="bold" fill="#235f5e">状态转移：从当前决策到下一步</text><rect x="48" y="99" width="128" height="65" rx="12" fill="#d2e8dc" stroke="#92b4ac"/><text x="112" y="139" font-size="21" text-anchor="middle" fill="#204f50">选 1</text><rect x="191" y="99" width="128" height="65" rx="12" fill="#d2e8dc" stroke="#92b4ac"/><text x="255" y="139" font-size="21" text-anchor="middle" fill="#204f50">选 2</text><rect x="334" y="99" width="128" height="65" rx="12" fill="#d2e8dc" stroke="#92b4ac"/><text x="398" y="139" font-size="21" text-anchor="middle" fill="#204f50">选 3</text><path d="M320 200 H420" stroke="#bd7855" stroke-width="4"/><path d="M418 190 l17 10 -17 10" fill="none" stroke="#bd7855" stroke-width="4"/><text x="360" y="250" font-size="18" text-anchor="middle" fill="#98613b">撤销后可探索兄弟分支</text></svg>
