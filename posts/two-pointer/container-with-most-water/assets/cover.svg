<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">容器最大水量的矩形面积与两端柱子</title><desc id="d">当前区间 [left,right] 内尚有未排除的候选边界；best 保存已检查最大面积。每次丢弃较短边，保证被丢弃的边界不可能与更近的任何柱构成更大面积。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="36" y="43" font-size="17" fill="#356d6b" font-weight="bold">TWO POINTERS · area = width × min height</text><rect x="138" y="98" width="608" height="140" fill="#a8dad8" opacity=".35"/><path d="M138 98 H692" stroke="#3d999d" stroke-width="3" stroke-dasharray="7 7"/><rect x="44" y="218" width="35" height="20" rx="4" fill="#b4d5cb"/><text x="62" y="259" font-size="13" text-anchor="middle" fill="#385d59">0</text><rect x="120" y="78" width="35" height="160" rx="4" fill="#207d79"/><text x="138" y="259" font-size="13" text-anchor="middle" fill="#385d59">1</text><rect x="196" y="118" width="35" height="120" rx="4" fill="#b4d5cb"/><text x="214" y="259" font-size="13" text-anchor="middle" fill="#385d59">2</text><rect x="272" y="198" width="35" height="40" rx="4" fill="#b4d5cb"/><text x="290" y="259" font-size="13" text-anchor="middle" fill="#385d59">3</text><rect x="348" y="138" width="35" height="100" rx="4" fill="#b4d5cb"/><text x="366" y="259" font-size="13" text-anchor="middle" fill="#385d59">4</text><rect x="424" y="158" width="35" height="80" rx="4" fill="#b4d5cb"/><text x="442" y="259" font-size="13" text-anchor="middle" fill="#385d59">5</text><rect x="500" y="78" width="35" height="160" rx="4" fill="#b4d5cb"/><text x="518" y="259" font-size="13" text-anchor="middle" fill="#385d59">6</text><rect x="576" y="178" width="35" height="60" rx="4" fill="#b4d5cb"/><text x="594" y="259" font-size="13" text-anchor="middle" fill="#385d59">7</text><rect x="652" y="98" width="35" height="140" rx="4" fill="#d48257"/><text x="670" y="259" font-size="13" text-anchor="middle" fill="#385d59">8</text><text x="380" y="182" font-size="30" fill="#145958" font-weight="bold">7 × 7 = 49</text></svg>
