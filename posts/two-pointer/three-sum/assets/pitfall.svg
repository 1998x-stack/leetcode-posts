<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">15 常见错误及正确不变量</title><desc id="d">不能只删除整个结果列表的重复项却忘记指针前进；也不能在找到解后只动一端而不处理同值。固定首项已经大于 0 时可提前结束，因为后两数不会更小。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="33" y="48" font-size="20" fill="#315e59" font-weight="bold">对照：哪一步会破坏不变量？</text><rect x="38" y="84" width="300" height="132" rx="14" fill="#fae8dd" stroke="#deae8c"/><rect x="382" y="84" width="300" height="132" rx="14" fill="#d7ede3" stroke="#9fc8b6"/><text x="188" y="143" text-anchor="middle" fill="#9a503a" font-size="21" font-weight="bold">错误：重复答案</text><text x="532" y="143" text-anchor="middle" fill="#236c61" font-size="21" font-weight="bold">正确：排序后跳过同值</text><text x="360" y="263" font-size="15" text-anchor="middle" fill="#56746f">理解错误状态，才能知道优化为何成立</text></svg>
