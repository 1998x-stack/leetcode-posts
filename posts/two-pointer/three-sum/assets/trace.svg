<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">15 关键状态转移</title><desc id="d">排序后依次固定首项 a[i]，在剩余有序区间寻找两数之和 = -a[i]。命中时收录三元组，然后左右同时移动，跳过与刚才相同的值。外层也跳过相同的 a[i]，避免重复答案。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="36" y="46" font-size="20" font-weight="bold" fill="#235f5e">状态转移：从当前决策到下一步</text><rect x="48" y="99" width="128" height="65" rx="12" fill="#d2e8dc" stroke="#92b4ac"/><text x="112" y="139" font-size="21" text-anchor="middle" fill="#204f50">-1</text><rect x="191" y="99" width="128" height="65" rx="12" fill="#d2e8dc" stroke="#92b4ac"/><text x="255" y="139" font-size="21" text-anchor="middle" fill="#204f50">-1</text><rect x="334" y="99" width="128" height="65" rx="12" fill="#d2e8dc" stroke="#92b4ac"/><text x="398" y="139" font-size="21" text-anchor="middle" fill="#204f50">2</text><path d="M320 200 H420" stroke="#bd7855" stroke-width="4"/><path d="M418 190 l17 10 -17 10" fill="none" stroke="#bd7855" stroke-width="4"/><text x="360" y="250" font-size="18" text-anchor="middle" fill="#98613b">固定值后收缩左右指针</text></svg>
