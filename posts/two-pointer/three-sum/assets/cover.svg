<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">排序后三个指针组合成零和三元组</title><desc id="d">固定排序数组中的位置 i。left=i+1，right=n-1。未扫描的候选位于 [left,right]；当和偏小时，left 向右会使和不减；偏大时，right 向左会使和不增。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="36" y="43" font-size="17" fill="#356d6b" font-weight="bold">SORT + TWO POINTERS</text><rect x="58" y="95" width="82" height="70" rx="9" fill="#f8faf7" stroke="#a1c3b7"/><text x="99" y="139" font-size="28" text-anchor="middle" fill="#164b4d">-4</text><rect x="158" y="95" width="82" height="70" rx="9" fill="#edbd9f" stroke="#a1c3b7"/><text x="199" y="139" font-size="28" text-anchor="middle" fill="#164b4d">-1</text><rect x="258" y="95" width="82" height="70" rx="9" fill="#b8dfd1" stroke="#a1c3b7"/><text x="299" y="139" font-size="28" text-anchor="middle" fill="#164b4d">-1</text><rect x="358" y="95" width="82" height="70" rx="9" fill="#f8faf7" stroke="#a1c3b7"/><text x="399" y="139" font-size="28" text-anchor="middle" fill="#164b4d">0</text><rect x="458" y="95" width="82" height="70" rx="9" fill="#f8faf7" stroke="#a1c3b7"/><text x="499" y="139" font-size="28" text-anchor="middle" fill="#164b4d">1</text><rect x="558" y="95" width="82" height="70" rx="9" fill="#b8dfd1" stroke="#a1c3b7"/><text x="599" y="139" font-size="28" text-anchor="middle" fill="#164b4d">2</text><g font-size="18" font-weight="bold" text-anchor="middle"><text x="199" y="195" fill="#a65c3a">FIX i</text><text x="299" y="195" fill="#19756f">LEFT</text><text x="599" y="195" fill="#19756f">RIGHT</text></g><path d="M199 218 H599" stroke="#7fa7a0" stroke-width="3" stroke-dasharray="7 8"/><text x="385" y="254" text-anchor="middle" font-size="25" fill="#1b6461">-1 + -1 + 2 = 0</text></svg>
