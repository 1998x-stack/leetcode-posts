<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="range-pitfall-title range-pitfall-desc"><title id="range-pitfall-title">找到一个相等值后线性扩展的复杂度</title><desc id="range-pitfall-desc">数组可能包含大量相同值；先二分找到一个位置再向两侧扫描，最坏会退化到 O(n)。</desc>
<rect x="28" y="24" width="904" height="272" rx="18" fill="#fff" stroke="#d5e3da"/><text x="58" y="64" font-size="21" font-weight="700" fill="#19393d">反例：数组中所有元素都是 8</text>
<rect x="60" y="98" width="68" height="58" rx="8" fill="#fae4d9" stroke="#c66e52"/><text x="94" y="135" text-anchor="middle" font-size="21" font-weight="700" fill="#8c432a">8</text><rect x="154" y="98" width="68" height="58" rx="8" fill="#fae4d9" stroke="#c66e52"/><text x="188" y="135" text-anchor="middle" font-size="21" font-weight="700" fill="#8c432a">8</text><rect x="248" y="98" width="68" height="58" rx="8" fill="#fae4d9" stroke="#c66e52"/><text x="282" y="135" text-anchor="middle" font-size="21" font-weight="700" fill="#8c432a">8</text><rect x="342" y="98" width="68" height="58" rx="8" fill="#fae4d9" stroke="#c66e52"/><text x="376" y="135" text-anchor="middle" font-size="21" font-weight="700" fill="#8c432a">8</text><rect x="436" y="98" width="68" height="58" rx="8" fill="#f8efe6" stroke="#d99a72"/><text x="470" y="135" text-anchor="middle" font-size="21" font-weight="700" fill="#8c432a">8</text><rect x="530" y="98" width="68" height="58" rx="8" fill="#fae4d9" stroke="#c66e52"/><text x="564" y="135" text-anchor="middle" font-size="21" font-weight="700" fill="#8c432a">8</text><rect x="624" y="98" width="68" height="58" rx="8" fill="#fae4d9" stroke="#c66e52"/><text x="658" y="135" text-anchor="middle" font-size="21" font-weight="700" fill="#8c432a">8</text><rect x="718" y="98" width="68" height="58" rx="8" fill="#fae4d9" stroke="#c66e52"/><text x="752" y="135" text-anchor="middle" font-size="21" font-weight="700" fill="#8c432a">8</text><rect x="812" y="98" width="68" height="58" rx="8" fill="#fae4d9" stroke="#c66e52"/><text x="846" y="135" text-anchor="middle" font-size="21" font-weight="700" fill="#8c432a">8</text>
<path d="M 94 185 H 846" stroke="#c66e52" stroke-width="4"/><text x="470" y="220" text-anchor="middle" font-size="17" fill="#8c432a">从命中点向左右扩展：可能检查全部 n 个元素</text><text x="470" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#176c6d">两个边界都二分：O(log n) + O(log n) = O(log n)</text></svg>
