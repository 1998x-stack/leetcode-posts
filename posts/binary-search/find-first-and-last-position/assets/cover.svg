<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="range-cover-title range-cover-desc"><title id="range-cover-title">首末位置：lower bound 与 upper bound</title><desc id="range-cover-desc">目标值 8 在索引 3 和 4；下界是第一个大于等于 8 的位置 3，上界是第一个大于 8 的位置 5。</desc>
<rect x="28" y="24" width="904" height="272" rx="18" fill="#f7faf7" stroke="#d5e3da"/><text x="58" y="62" font-size="21" font-weight="700" fill="#19393d">nums = [5, 7, 7, 8, 8, 10]　target = 8</text>
<rect x="54" y="100" width="100" height="62" rx="9" fill="#fff" stroke="#b9cec3" stroke-width="2"/><text x="104" y="139" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">5</text><text x="104" y="185" text-anchor="middle" font-size="13" fill="#58716f">0</text><rect x="194" y="100" width="100" height="62" rx="9" fill="#fff" stroke="#b9cec3" stroke-width="2"/><text x="244" y="139" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">7</text><text x="244" y="185" text-anchor="middle" font-size="13" fill="#58716f">1</text><rect x="334" y="100" width="100" height="62" rx="9" fill="#fff" stroke="#b9cec3" stroke-width="2"/><text x="384" y="139" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">7</text><text x="384" y="185" text-anchor="middle" font-size="13" fill="#58716f">2</text><rect x="474" y="100" width="100" height="62" rx="9" fill="#d5ede4" stroke="#2f8681" stroke-width="2"/><text x="524" y="139" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">8</text><text x="524" y="185" text-anchor="middle" font-size="13" fill="#58716f">3</text><rect x="614" y="100" width="100" height="62" rx="9" fill="#d5ede4" stroke="#2f8681" stroke-width="2"/><text x="664" y="139" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">8</text><text x="664" y="185" text-anchor="middle" font-size="13" fill="#58716f">4</text><rect x="754" y="100" width="100" height="62" rx="9" fill="#fff" stroke="#b9cec3" stroke-width="2"/><text x="804" y="139" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">10</text><text x="804" y="185" text-anchor="middle" font-size="13" fill="#58716f">5</text>
<path d="M 474 206 V 234" stroke="#2f8681" stroke-width="3"/><text x="474" y="258" text-anchor="middle" font-size="16" fill="#176c6d">lower_bound(8) = 3</text>
<path d="M 754 206 V 234" stroke="#bc7149" stroke-width="3"/><text x="754" y="258" text-anchor="middle" font-size="16" fill="#8c432a">upper_bound(8) = 5</text>
<path d="M 474 220 H 754" stroke="#8ca99b" stroke-width="2" stroke-dasharray="6 5"/><text x="614" y="285" text-anchor="middle" font-size="15" fill="#19393d">答案区间 [3, 5 − 1] = [3, 4]</text></svg>
