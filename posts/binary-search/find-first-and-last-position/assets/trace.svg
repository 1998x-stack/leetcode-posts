<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="range-trace-title range-trace-desc"><title id="range-trace-title">半开区间边界查找</title><desc id="range-trace-desc">lower bound 找第一个大于等于目标的位置；upper bound 找第一个严格大于目标的位置。</desc>
<rect x="28" y="24" width="904" height="272" rx="18" fill="#fff" stroke="#d5e3da"/>
<rect x="58" y="74" width="392" height="174" rx="12" fill="#edf4ed" stroke="#9ebdb0"/><text x="254" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#176c6d">lower_bound(8)</text><text x="88" y="152" font-size="17" fill="#19393d">第一个 nums[i] ≥ 8</text><text x="88" y="190" font-size="20" font-weight="700" fill="#176c6d">位置 3 · 值 8</text><text x="88" y="220" font-size="14" fill="#58716f">左侧全部 &lt; 8</text>
<rect x="510" y="74" width="392" height="174" rx="12" fill="#f8efe6" stroke="#d99a72"/><text x="706" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#8c432a">upper_bound(8)</text><text x="540" y="152" font-size="17" fill="#19393d">第一个 nums[i] &gt; 8</text><text x="540" y="190" font-size="20" font-weight="700" fill="#8c432a">位置 5 · 值 10</text><text x="540" y="220" font-size="14" fill="#58716f">左侧全部 ≤ 8</text></svg>
