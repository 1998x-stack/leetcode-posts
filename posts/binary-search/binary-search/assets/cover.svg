<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="binary-cover-title binary-cover-desc"><title id="binary-cover-title">闭区间二分查找</title><desc id="binary-cover-desc">升序数组中点为 3，小于目标 9，因此排除中点及左侧区间。</desc>
<rect x="28" y="24" width="904" height="272" rx="18" fill="#f7faf7" stroke="#d5e3da"/><text x="58" y="62" font-size="21" font-weight="700" fill="#19393d">nums = [-1, 0, 3, 5, 9, 12]　target = 9</text>
<rect x="54" y="104" width="100" height="64" rx="9" fill="#fff" stroke="#b9cec3" stroke-width="2"/><text x="104" y="145" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">-1</text><text x="104" y="190" text-anchor="middle" font-size="13" fill="#58716f">0</text><rect x="194" y="104" width="100" height="64" rx="9" fill="#fff" stroke="#b9cec3" stroke-width="2"/><text x="244" y="145" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">0</text><text x="244" y="190" text-anchor="middle" font-size="13" fill="#58716f">1</text><rect x="334" y="104" width="100" height="64" rx="9" fill="#f8efe6" stroke="#d99a72" stroke-width="2"/><text x="384" y="145" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">3</text><text x="384" y="190" text-anchor="middle" font-size="13" fill="#58716f">2</text><rect x="474" y="104" width="100" height="64" rx="9" fill="#fff" stroke="#b9cec3" stroke-width="2"/><text x="524" y="145" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">5</text><text x="524" y="190" text-anchor="middle" font-size="13" fill="#58716f">3</text><rect x="614" y="104" width="100" height="64" rx="9" fill="#d5ede4" stroke="#2f8681" stroke-width="2"/><text x="664" y="145" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">9</text><text x="664" y="190" text-anchor="middle" font-size="13" fill="#58716f">4</text><rect x="754" y="104" width="100" height="64" rx="9" fill="#fff" stroke="#b9cec3" stroke-width="2"/><text x="804" y="145" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">12</text><text x="804" y="190" text-anchor="middle" font-size="13" fill="#58716f">5</text>
<path d="M 54 214 H 434" stroke="#bc7149" stroke-width="4"/><path d="M 54 205 V 223 M 434 205 V 223" stroke="#bc7149" stroke-width="3"/><text x="244" y="246" text-anchor="middle" font-size="16" fill="#8c432a">mid = 2，nums[mid] = 3 &lt; 9</text>
<path d="M 474 214 H 894" stroke="#2f8681" stroke-width="4"/><path d="M 474 205 V 223 M 894 205 V 223" stroke="#2f8681" stroke-width="3"/><text x="684" y="246" text-anchor="middle" font-size="16" fill="#124d4b">保留右半区间 [3, 5]</text></svg>
