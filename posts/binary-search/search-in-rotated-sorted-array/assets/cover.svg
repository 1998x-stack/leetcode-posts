<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="rotated-cover-title rotated-cover-desc"><title id="rotated-cover-title">旋转数组中总有一半保持有序</title><desc id="rotated-cover-desc">中点把数组切成两段，左半边 4 到 7 仍然有序，目标 0 不在其中，因此排除左半边。</desc>
<rect x="28" y="24" width="904" height="272" rx="18" fill="#f7faf7" stroke="#d5e3da"/><text x="58" y="62" font-size="21" font-weight="700" fill="#19393d">nums = [4, 5, 6, 7, 0, 1, 2]　target = 0</text>
<rect x="54" y="104" width="88" height="62" rx="9" fill="#d5ede4" stroke="#2f8681" stroke-width="2"/><text x="98" y="143" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">4</text><text x="98" y="190" text-anchor="middle" font-size="13" fill="#58716f">0</text><rect x="176" y="104" width="88" height="62" rx="9" fill="#d5ede4" stroke="#2f8681" stroke-width="2"/><text x="220" y="143" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">5</text><text x="220" y="190" text-anchor="middle" font-size="13" fill="#58716f">1</text><rect x="298" y="104" width="88" height="62" rx="9" fill="#d5ede4" stroke="#2f8681" stroke-width="2"/><text x="342" y="143" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">6</text><text x="342" y="190" text-anchor="middle" font-size="13" fill="#58716f">2</text><rect x="420" y="104" width="88" height="62" rx="9" fill="#d5ede4" stroke="#2f8681" stroke-width="2"/><text x="464" y="143" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">7</text><text x="464" y="190" text-anchor="middle" font-size="13" fill="#58716f">3</text><rect x="542" y="104" width="88" height="62" rx="9" fill="#f8efe6" stroke="#d99a72" stroke-width="2"/><text x="586" y="143" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">0</text><text x="586" y="190" text-anchor="middle" font-size="13" fill="#58716f">4</text><rect x="664" y="104" width="88" height="62" rx="9" fill="#f8efe6" stroke="#d99a72" stroke-width="2"/><text x="708" y="143" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">1</text><text x="708" y="190" text-anchor="middle" font-size="13" fill="#58716f">5</text><rect x="786" y="104" width="88" height="62" rx="9" fill="#f8efe6" stroke="#d99a72" stroke-width="2"/><text x="830" y="143" text-anchor="middle" font-size="24" font-weight="700" fill="#19393d">2</text><text x="830" y="190" text-anchor="middle" font-size="13" fill="#58716f">6</text>
<path d="M 54 220 H 544" stroke="#2f8681" stroke-width="4"/><text x="300" y="250" text-anchor="middle" font-size="17" fill="#176c6d">左半区 [4,5,6,7] 有序</text>
<path d="M 566 220 H 906" stroke="#bc7149" stroke-width="4"/><text x="736" y="250" text-anchor="middle" font-size="17" fill="#8c432a">目标 0 不在左半区</text></svg>
