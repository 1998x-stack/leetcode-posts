<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">33 Search in Rotated Sorted Array cover</title><desc id="d">若目标存在，它始终位于闭区间 [left,right]。旋转数组只有一个下降断点，所以以 mid 分割后至少一侧有序；判断 target 是否落在有序半区的值域内，就能安全丢弃另一半。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="32" y="38" font-size="17" fill="#356d6b">ROTATED ARRAY · ONE DROP</text><rect x="35" y="88" width="72" height="62" rx="9" fill="#b9e0d2" stroke="#86afa3"/><text x="71" y="127" text-anchor="middle" font-size="26" fill="#184b4d">4</text><rect x="129" y="88" width="72" height="62" rx="9" fill="#b9e0d2" stroke="#86afa3"/><text x="165" y="127" text-anchor="middle" font-size="26" fill="#184b4d">5</text><rect x="223" y="88" width="72" height="62" rx="9" fill="#b9e0d2" stroke="#86afa3"/><text x="259" y="127" text-anchor="middle" font-size="26" fill="#184b4d">6</text><rect x="317" y="88" width="72" height="62" rx="9" fill="#b9e0d2" stroke="#86afa3"/><text x="353" y="127" text-anchor="middle" font-size="26" fill="#184b4d">7</text><rect x="411" y="88" width="72" height="62" rx="9" fill="#f5dfc9" stroke="#86afa3"/><text x="447" y="127" text-anchor="middle" font-size="26" fill="#184b4d">0</text><rect x="505" y="88" width="72" height="62" rx="9" fill="#f5dfc9" stroke="#86afa3"/><text x="541" y="127" text-anchor="middle" font-size="26" fill="#184b4d">1</text><rect x="599" y="88" width="72" height="62" rx="9" fill="#f5dfc9" stroke="#86afa3"/><text x="635" y="127" text-anchor="middle" font-size="26" fill="#184b4d">2</text><path d="M410 70 V166" stroke="#c67b53" stroke-width="4" stroke-dasharray="7 6"/><text x="215" y="196" text-anchor="middle" font-size="17" fill="#246f67">左侧升序 4 → 7</text><text x="535" y="196" text-anchor="middle" font-size="17" fill="#98623f">右侧升序 0 → 2</text><text x="360" y="252" text-anchor="middle" font-size="22" fill="#225b58">target = 0 · 保留可能所在的半区</text></svg>
