<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">33 Search in Rotated Sorted Array trace</title><desc id="d">若目标存在，它始终位于闭区间 [left,right]。旋转数组只有一个下降断点，所以以 mid 分割后至少一侧有序；判断 target 是否落在有序半区的值域内，就能安全丢弃另一半。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="30" y="38" font-size="19" fill="#285e59">KEEP THE POSSIBLE HALF</text><rect x="38" y="86" width="300" height="94" rx="12" fill="#d3e9df" stroke="#84afa2"/><rect x="382" y="86" width="300" height="94" rx="12" fill="#f6e6d8" stroke="#d7aa88"/><text x="188" y="122" text-anchor="middle" font-size="18" fill="#246d64">[4,5,6,7]</text><text x="188" y="154" text-anchor="middle" font-size="15" fill="#246d64">有序，但不含 0</text><text x="532" y="122" text-anchor="middle" font-size="18" fill="#98623f">[0,1,2]</text><text x="532" y="154" text-anchor="middle" font-size="15" fill="#98623f">保留候选区间</text><text x="360" y="235" text-anchor="middle" font-size="21" fill="#245d58">left = mid + 1</text></svg>
