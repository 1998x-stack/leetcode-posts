<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="rotated-trace-title rotated-trace-desc"><title id="rotated-trace-title">先识别有序半区，再排除另一半</title><desc id="rotated-trace-desc">第一次中点 7，左半区有序但不含 0；第二次中点 1，左半区 [0,1] 有序并包含目标。</desc>
<rect x="28" y="24" width="904" height="272" rx="18" fill="#fff" stroke="#d5e3da"/>
<rect x="58" y="78" width="390" height="166" rx="12" fill="#edf4ed" stroke="#9ebdb0"/><text x="253" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#176c6d">第 1 轮 · mid=3，值 7</text><text x="88" y="154" font-size="17" fill="#19393d">左半区 [4,5,6,7] 有序</text><text x="88" y="190" font-size="17" fill="#19393d">0 不在 [4,7) → 排除左边</text><text x="88" y="220" font-size="15" fill="#176c6d">left = 4</text>
<rect x="510" y="78" width="392" height="166" rx="12" fill="#f8efe6" stroke="#d99a72"/><text x="706" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#8c432a">第 2 轮 · mid=5，值 1</text><text x="540" y="154" font-size="17" fill="#19393d">左半区 [0,1] 有序</text><text x="540" y="190" font-size="17" fill="#19393d">0 在 [0,1) → 保留左边</text><text x="540" y="220" font-size="15" fill="#8c432a">right = 4</text></svg>
