<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">322 Coin Change trace</title><desc id="d">dp[x] 表示凑出金额 x 所需的最少硬币数。dp[0]=0；其他金额初始化为不可达哨兵 amount+1。计算 x 时只依赖更小金额 x-coin。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="32" y="38" font-size="18" fill="#285e59">REMOVE THE LAST COIN</text><path d="M140 145 H580 M260 135 L275 145 L260 155 M410 135 L425 145 L410 155 M560 135 L575 145 L560 155" stroke="#8db4a7" stroke-width="4" fill="none"/><circle cx="140" cy="145" r="34" fill="#f2d2ba" stroke="#84afa2" stroke-width="2"/><text x="140" y="153" text-anchor="middle" font-size="23" fill="#205553">11</text><circle cx="290" cy="145" r="34" fill="#cde6dc" stroke="#84afa2" stroke-width="2"/><text x="290" y="153" text-anchor="middle" font-size="23" fill="#205553">6</text><circle cx="440" cy="145" r="34" fill="#cde6dc" stroke="#84afa2" stroke-width="2"/><text x="440" y="153" text-anchor="middle" font-size="23" fill="#205553">1</text><circle cx="590" cy="145" r="34" fill="#cde6dc" stroke="#84afa2" stroke-width="2"/><text x="590" y="153" text-anchor="middle" font-size="23" fill="#205553">0</text><text x="360" y="268" text-anchor="middle" font-size="19" fill="#245d58">11 = 5 + 5 + 1 · 3 枚硬币</text></svg>
