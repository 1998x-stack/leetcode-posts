<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="two-sum-cover-title two-sum-cover-desc"><title id="two-sum-cover-title">两数之和：补数映射</title><desc id="two-sum-cover-desc">扫描到 7 时，哈希表中已经保存 2 的索引 0，因此 target-7=2 命中。</desc>
<rect x="28" y="24" width="904" height="272" rx="18" fill="#f7faf7" stroke="#d5e3da"/>
<text x="58" y="64" font-size="22" font-weight="700" fill="#19393d">nums = [2, 7, 11, 15]　target = 9</text>
<rect x="58" y="104" width="92" height="66" rx="10" fill="#fff" stroke="#b9cec3" stroke-width="2"/><text x="104" y="145" text-anchor="middle" font-size="26" font-weight="700" fill="#19393d">2</text><text x="104" y="194" text-anchor="middle" font-size="14" fill="#58716f">index 0</text><rect x="188" y="104" width="92" height="66" rx="10" fill="#d5ede4" stroke="#2f8681" stroke-width="2"/><text x="234" y="145" text-anchor="middle" font-size="26" font-weight="700" fill="#19393d">7</text><text x="234" y="194" text-anchor="middle" font-size="14" fill="#58716f">index 1</text><rect x="318" y="104" width="92" height="66" rx="10" fill="#fff" stroke="#b9cec3" stroke-width="2"/><text x="364" y="145" text-anchor="middle" font-size="26" font-weight="700" fill="#19393d">11</text><text x="364" y="194" text-anchor="middle" font-size="14" fill="#58716f">index 2</text><rect x="448" y="104" width="92" height="66" rx="10" fill="#fff" stroke="#b9cec3" stroke-width="2"/><text x="494" y="145" text-anchor="middle" font-size="26" font-weight="700" fill="#19393d">15</text><text x="494" y="194" text-anchor="middle" font-size="14" fill="#58716f">index 3</text>
<path d="M 150 226 H 280" stroke="#bc7149" stroke-width="3" fill="none"/><path d="M 272 218 L 284 226 L 272 234" stroke="#bc7149" stroke-width="3" fill="none"/>
<rect x="302" y="207" width="245" height="64" rx="10" fill="#f8efe6" stroke="#d99a72"/><text x="424" y="234" text-anchor="middle" font-size="17" fill="#8c432a">need = 9 − 7 = 2</text><text x="424" y="257" text-anchor="middle" font-size="14" fill="#8c432a">seen[2] = 0</text>
<path d="M 548 239 H 664" stroke="#2f8681" stroke-width="3"/><path d="M 656 231 L 668 239 L 656 247" stroke="#2f8681" stroke-width="3" fill="none"/>
<rect x="680" y="207" width="222" height="64" rx="10" fill="#d5ede4" stroke="#2f8681"/><text x="791" y="235" text-anchor="middle" font-size="20" font-weight="700" fill="#124d4b">答案 [0, 1]</text><text x="791" y="257" text-anchor="middle" font-size="13" fill="#124d4b">2 + 7 = 9</text></svg>
