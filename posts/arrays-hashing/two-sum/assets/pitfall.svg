<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="two-sum-pitfall-title two-sum-pitfall-desc"><title id="two-sum-pitfall-title">两数之和的同索引陷阱</title><desc id="two-sum-pitfall-desc">若先写入当前值再查补数，nums=[3] target=6 会错误地将同一元素用两次。</desc>
<rect x="28" y="24" width="904" height="272" rx="18" fill="#fff" stroke="#d5e3da"/>
<text x="60" y="64" font-size="21" font-weight="700" fill="#19393d">反例：nums = [3]，target = 6</text>
<rect x="70" y="102" width="180" height="76" rx="10" fill="#fae4d9" stroke="#c66e52" stroke-width="2"/><text x="160" y="134" text-anchor="middle" font-size="23" font-weight="700" fill="#8c432a">3 · index 0</text><text x="160" y="158" text-anchor="middle" font-size="14" fill="#8c432a">唯一一个元素</text>
<path d="M 270 140 H 360" stroke="#c66e52" stroke-width="3"/><path d="M 352 132 L 364 140 L 352 148" stroke="#c66e52" stroke-width="3" fill="none"/>
<rect x="378" y="102" width="220" height="76" rx="10" fill="#f8efe6" stroke="#d99a72"/><text x="488" y="133" text-anchor="middle" font-size="18" fill="#8c432a">先插入 seen[3]=0</text><text x="488" y="158" text-anchor="middle" font-size="14" fill="#8c432a">再查 need=3</text>
<path d="M 610 140 H 690" stroke="#c66e52" stroke-width="3"/><path d="M 682 132 L 694 140 L 682 148" stroke="#c66e52" stroke-width="3" fill="none"/>
<rect x="708" y="102" width="190" height="76" rx="10" fill="#fae4d9" stroke="#c66e52" stroke-width="2"/><text x="803" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#8c432a">错误 [0, 0]</text><text x="803" y="158" text-anchor="middle" font-size="14" fill="#8c432a">同一索引被用两次</text>
<text x="480" y="244" text-anchor="middle" font-size="19" font-weight="700" fill="#176c6d">正确顺序：先查询，再插入当前元素</text></svg>
