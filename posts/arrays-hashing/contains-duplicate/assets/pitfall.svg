<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="dup-pitfall-title dup-pitfall-desc"><title id="dup-pitfall-title">集合与排序方案的取舍</title><desc id="dup-pitfall-desc">哈希集合不改变输入，排序后相邻比较也能判重，但排序可能改变原数组顺序。</desc>
<rect x="28" y="24" width="904" height="272" rx="18" fill="#fff" stroke="#d5e3da"/>
<rect x="60" y="78" width="385" height="174" rx="12" fill="#edf4ed" stroke="#9ebdb0"/><text x="252" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#19393d">哈希集合</text><text x="90" y="152" font-size="17" fill="#19393d">扫描时查询成员关系</text><text x="90" y="184" font-size="17" fill="#19393d">期望 O(n) 时间 · O(n) 空间</text><text x="90" y="218" font-size="15" fill="#176c6d">不修改输入 · 可提前退出</text>
<rect x="515" y="78" width="385" height="174" rx="12" fill="#f8efe6" stroke="#d99a72"/><text x="707" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#8c432a">排序后相邻比较</text><text x="545" y="152" font-size="17" fill="#19393d">先排序，再检查相邻值</text><text x="545" y="184" font-size="17" fill="#19393d">O(n log n) 时间</text><text x="545" y="218" font-size="15" fill="#8c432a">可能改变输入顺序，需考虑副本</text></svg>
