<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="dup-trace-title dup-trace-desc"><title id="dup-trace-title">集合在扫描过程中的变化</title><desc id="dup-trace-desc">从空集合开始，依次加入 1、2、3；再次遇到 1 时立即返回 true。</desc>
<rect x="28" y="24" width="904" height="272" rx="18" fill="#fff" stroke="#d5e3da"/>
<text x="58" y="64" font-size="21" font-weight="700" fill="#19393d">扫描前缀 → 已见集合</text>
<rect x="60" y="108" width="165" height="70" rx="10" fill="#edf4ed" stroke="#9ebdb0"/><text x="142" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#19393d">{}</text><text x="142" y="202" text-anchor="middle" font-size="13" fill="#58716f">加入新值</text><rect x="275" y="108" width="165" height="70" rx="10" fill="#edf4ed" stroke="#9ebdb0"/><text x="357" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#19393d">{1}</text><text x="357" y="202" text-anchor="middle" font-size="13" fill="#58716f">加入新值</text><rect x="490" y="108" width="165" height="70" rx="10" fill="#edf4ed" stroke="#9ebdb0"/><text x="572" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#19393d">{1, 2}</text><text x="572" y="202" text-anchor="middle" font-size="13" fill="#58716f">加入新值</text><rect x="705" y="108" width="165" height="70" rx="10" fill="#fae4d9" stroke="#c66e52"/><text x="787" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#8c432a">{1, 2, 3}</text><text x="787" y="202" text-anchor="middle" font-size="13" fill="#58716f">再遇到 1</text>
<path d="M 235 143 H 263 M 450 143 H 478 M 665 143 H 693" stroke="#bc7149" stroke-width="3"/><path d="M 256 135 L 268 143 L 256 151 M 471 135 L 483 143 L 471 151 M 686 135 L 698 143 L 686 151" stroke="#bc7149" stroke-width="3" fill="none"/>
<text x="480" y="260" text-anchor="middle" font-size="18" fill="#176c6d">在重复值到来之前，seen 始终等于已扫描前缀中的不同值集合</text></svg>
