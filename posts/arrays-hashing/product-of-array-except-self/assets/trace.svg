<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="product-trace-title product-trace-desc"><title id="product-trace-title">两趟扫描合并左右乘积</title><desc id="product-trace-desc">第一趟写入当前位置左侧乘积，第二趟从右向左乘上后缀累积。</desc>
<rect x="28" y="24" width="904" height="272" rx="18" fill="#fff" stroke="#d5e3da"/>
<text x="58" y="62" font-size="20" font-weight="700" fill="#19393d">第一趟：写入左侧乘积</text><text x="58" y="100" font-size="18" fill="#176c6d">answer = [1, 1, 2, 6]</text>
<path d="M 58 120 H 900" stroke="#d5e3da" stroke-width="2"/>
<text x="58" y="160" font-size="20" font-weight="700" fill="#19393d">第二趟：右侧累积从 1 开始</text>
<rect x="58" y="182" width="178" height="76" rx="10" fill="#d5ede4" stroke="#2f8681"/><text x="147" y="211" text-anchor="middle" font-size="16" fill="#19393d">i = 3</text><text x="147" y="239" text-anchor="middle" font-size="17" font-weight="700" fill="#8c432a">6 × 1 = 6</text><rect x="270" y="182" width="178" height="76" rx="10" fill="#f8efe6" stroke="#d99a72"/><text x="359" y="211" text-anchor="middle" font-size="16" fill="#19393d">i = 2</text><text x="359" y="239" text-anchor="middle" font-size="17" font-weight="700" fill="#8c432a">2 × 4 = 8</text><rect x="482" y="182" width="178" height="76" rx="10" fill="#f8efe6" stroke="#d99a72"/><text x="571" y="211" text-anchor="middle" font-size="16" fill="#19393d">i = 1</text><text x="571" y="239" text-anchor="middle" font-size="17" font-weight="700" fill="#8c432a">1 × 12 = 12</text><rect x="694" y="182" width="178" height="76" rx="10" fill="#f8efe6" stroke="#d99a72"/><text x="783" y="211" text-anchor="middle" font-size="16" fill="#19393d">i = 0</text><text x="783" y="239" text-anchor="middle" font-size="17" font-weight="700" fill="#8c432a">1 × 24 = 24</text></svg>
