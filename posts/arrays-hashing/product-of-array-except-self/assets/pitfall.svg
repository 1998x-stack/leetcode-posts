<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="product-pitfall-title product-pitfall-desc"><title id="product-pitfall-title">为什么直接除以当前元素不可靠</title><desc id="product-pitfall-desc">题目明确禁止除法；数组可能包含零，零会使总乘积无法通过除法恢复每个位置的答案。</desc>
<rect x="28" y="24" width="904" height="272" rx="18" fill="#fff" stroke="#d5e3da"/>
<rect x="70" y="82" width="360" height="150" rx="12" fill="#fae4d9" stroke="#c66e52"/><text x="250" y="120" text-anchor="middle" font-size="20" font-weight="700" fill="#8c432a">错误思路：总乘积 ÷ nums[i]</text><text x="250" y="163" text-anchor="middle" font-size="22" fill="#8c432a">[2, 3, 0, 4]</text><text x="250" y="198" text-anchor="middle" font-size="16" fill="#8c432a">总乘积为 0，除以 0 不成立</text>
<rect x="530" y="82" width="360" height="150" rx="12" fill="#edf4ed" stroke="#9ebdb0"/><text x="710" y="120" text-anchor="middle" font-size="20" font-weight="700" fill="#176c6d">正确思路：左右两侧相乘</text><text x="710" y="163" text-anchor="middle" font-size="22" fill="#19393d">prefix × suffix</text><text x="710" y="198" text-anchor="middle" font-size="16" fill="#176c6d">零自然参与乘法，不需特判</text></svg>
