<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">字母异位词分组 · pitfall</title><desc id="desc">常见错误与正确判断的对照</desc><defs><style>.k{font:700 25px system-ui;fill:#203035}.small{font:16px system-ui;fill:#53676d}.node{fill:#eaf3f1;stroke:#147f80;stroke-width:2}.panel{fill:#f3f9f6;stroke:#dce8e4;stroke-width:2}.good{fill:#e6f5ee;stroke:#23835c;stroke-width:2}.bad{fill:#fff0ec;stroke:#cf735b;stroke-width:2}.badText{font:700 18px system-ui;fill:#b54b34}.answer{font:700 22px system-ui;fill:#147f80}.line{stroke:#147f80;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="480" rx="24" fill="#fffdf9"/><rect x="80" y="95" width="370" height="230" rx="18" class="bad"/><text x="265" y="145" text-anchor="middle" class="k">错误：只按长度分组</text><text x="265" y="215" text-anchor="middle">eat / tan / bat</text><text x="265" y="275" text-anchor="middle" class="badText">长度相同 ≠ 字母相同</text><rect x="510" y="95" width="370" height="230" rx="18" class="good"/><text x="695" y="145" text-anchor="middle" class="k">正确：完整频次签名</text><text x="695" y="215" text-anchor="middle">a1 e1 t1 ≠ a1 n1 t1</text><text x="695" y="275" text-anchor="middle" class="answer">只有同构字母组成才合并</text></svg>