<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="level-pitfall-title level-pitfall-desc"><title id="level-pitfall-title">不要在一层循环里一直处理直到队列为空</title><desc id="level-pitfall-desc">如果内层使用 while queue，刚刚入队的孩子会立即被处理，结果不再按层分组。</desc>
<rect x="28" y="24" width="904" height="302" rx="18" fill="#fff" stroke="#d5e3da"/>
<rect x="70" y="86" width="360" height="164" rx="12" fill="#fae4d9" stroke="#c66e52"/><text x="250" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#8c432a">错误：while queue</text><text x="102" y="164" font-size="16" fill="#19393d">处理 3 → 入队 9、20</text><text x="102" y="194" font-size="16" fill="#19393d">队列仍非空，继续处理 9</text><text x="102" y="224" font-size="16" fill="#8c432a">下一层混进当前层</text>
<rect x="530" y="86" width="360" height="164" rx="12" fill="#edf4ed" stroke="#9ebdb0"/><text x="710" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#176c6d">正确：固定 level_size</text><text x="562" y="164" font-size="16" fill="#19393d">开始时 size = len(queue)</text><text x="562" y="194" font-size="16" fill="#19393d">只处理这 size 个节点</text><text x="562" y="224" font-size="16" fill="#176c6d">孩子留给下一层</text></svg>
