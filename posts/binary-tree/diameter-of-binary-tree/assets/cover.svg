<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="diameter-cover-title diameter-cover-desc"><title id="diameter-cover-title">二叉树直径：左右子树高度相加</title><desc id="diameter-cover-desc">在根节点 1 处，左子树高度为 2，右子树高度为 1，经过根节点的路径有 3 条边。</desc>
<rect x="28" y="24" width="904" height="302" rx="18" fill="#f7faf7" stroke="#d5e3da"/>
<path d="M 480 82 L 270 164 M 480 82 L 690 164 M 270 194 L 180 270 M 270 194 L 360 270" stroke="#8ca99b" stroke-width="3" fill="none"/>
<circle cx="480" cy="72" r="27" fill="#d5ede4" stroke="#2f8681" stroke-width="2"/><text x="480" y="80" text-anchor="middle" font-size="22" font-weight="700" fill="#19393d">1</text><circle cx="270" cy="164" r="27" fill="#d5ede4" stroke="#2f8681" stroke-width="2"/><text x="270" y="172" text-anchor="middle" font-size="22" font-weight="700" fill="#19393d">2</text><circle cx="690" cy="164" r="27" fill="#edf4ed" stroke="#2f8681" stroke-width="2"/><text x="690" y="172" text-anchor="middle" font-size="22" font-weight="700" fill="#19393d">3</text><circle cx="180" cy="270" r="27" fill="#edf4ed" stroke="#2f8681" stroke-width="2"/><text x="180" y="278" text-anchor="middle" font-size="22" font-weight="700" fill="#19393d">4</text><circle cx="360" cy="270" r="27" fill="#edf4ed" stroke="#2f8681" stroke-width="2"/><text x="360" y="278" text-anchor="middle" font-size="22" font-weight="700" fill="#19393d">5</text>
<path d="M 180 270 L 270 164 L 480 72 L 690 164" stroke="#bc7149" stroke-width="6" fill="none" stroke-linecap="round"/><text x="710" y="270" font-size="17" fill="#8c432a">最长路径：4 → 2 → 1 → 3</text>
<text x="710" y="300" font-size="16" fill="#176c6d">left=2，right=1，直径候选=3 条边</text></svg>
