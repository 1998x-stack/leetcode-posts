<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="diameter-pitfall-title diameter-pitfall-desc"><title id="diameter-pitfall-title">高度和直径不是同一个返回值</title><desc id="diameter-pitfall-desc">递归返回子树高度，当前节点用左右高度之和更新直径；如果只看根节点或把高度当直径，会漏掉答案。</desc>
<rect x="28" y="24" width="904" height="302" rx="18" fill="#fff" stroke="#d5e3da"/>
<rect x="60" y="78" width="390" height="174" rx="12" fill="#edf4ed" stroke="#9ebdb0"/><text x="255" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#176c6d">递归返回值：高度</text><text x="92" y="154" font-size="17" fill="#19393d">1 + max(left, right)</text><text x="92" y="190" font-size="16" fill="#58716f">表示从当前节点向下的最长路</text><text x="92" y="222" font-size="16" fill="#176c6d">供父节点继续计算</text>
<rect x="510" y="78" width="390" height="174" rx="12" fill="#f8efe6" stroke="#d99a72"/><text x="705" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#8c432a">全局更新：直径候选</text><text x="542" y="154" font-size="17" fill="#19393d">left + right</text><text x="542" y="190" font-size="16" fill="#58716f">表示穿过当前节点的边数</text><text x="542" y="222" font-size="16" fill="#8c432a">在每个节点都要检查</text></svg>
