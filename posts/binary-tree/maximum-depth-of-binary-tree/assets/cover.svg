<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="depth-cover-title depth-cover-desc"><title id="depth-cover-title">二叉树最大深度：左右子树高度汇总</title><desc id="depth-cover-desc">根节点 3 的左子树高度为 1，右子树高度为 2，因此整棵树的最大深度是 3。</desc>
<rect x="28" y="24" width="904" height="292" rx="18" fill="#f7faf7" stroke="#d5e3da"/>
<path d="M 480 94 L 270 174 M 480 94 L 690 174 M 690 206 L 600 272 M 690 206 L 790 272" stroke="#8ca99b" stroke-width="3" fill="none"/>
<circle cx="480" cy="82" r="30" fill="#d5ede4" stroke="#2f8681" stroke-width="2"/><text x="480" y="90" text-anchor="middle" font-size="22" font-weight="700" fill="#19393d">3</text><circle cx="270" cy="174" r="30" fill="#edf4ed" stroke="#2f8681" stroke-width="2"/><text x="270" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#19393d">9</text><circle cx="690" cy="174" r="30" fill="#d5ede4" stroke="#2f8681" stroke-width="2"/><text x="690" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#19393d">20</text><circle cx="600" cy="272" r="30" fill="#edf4ed" stroke="#2f8681" stroke-width="2"/><text x="600" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#19393d">15</text><circle cx="790" cy="272" r="30" fill="#edf4ed" stroke="#2f8681" stroke-width="2"/><text x="790" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#19393d">7</text>
<text x="110" y="110" font-size="17" fill="#176c6d">左子树深度 = 1</text><text x="735" y="116" font-size="17" fill="#176c6d">右子树深度 = 2</text>
<rect x="350" y="282" width="260" height="42" rx="8" fill="#f8efe6" stroke="#d99a72"/><text x="480" y="309" text-anchor="middle" font-size="17" font-weight="700" fill="#8c432a">1 + max(1, 2) = 3</text></svg>
