<path d="M 625 204 V 236 H 480 V 204" stroke="#bc7149" stroke-width="3" fill="none"/><rect x="360" y="238" width="240" height="54" rx="10" fill="#f8efe6" stroke="#d99a72"/><text x="480" y="272" text-anchor="middle" font-size="20" font-weight="700" fill="#8c432a">root 3 → height 3</text></svg>
