<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">146 LRU Cache cover</title><desc id="d">字典 nodes 将 key 映射到唯一链表节点；链表从 head.next 到 tail.prev 按最近使用程度从新到旧排列。head.next 是 MRU，tail.prev 是 LRU。每个真实节点在字典和链表中恰好出现一次。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="32" y="38" font-size="17" fill="#356d6b">LRU CACHE · LOOKUP + RECENCY ORDER</text><rect x="36" y="84" width="170" height="150" rx="12" fill="#e2eee8" stroke="#a6c5b9"/><text x="121" y="111" text-anchor="middle" font-size="18" fill="#2b6a64">HASH MAP</text><text x="121" y="150" text-anchor="middle" font-size="19" fill="#194f4c">1 → node 1</text><text x="121" y="184" text-anchor="middle" font-size="19" fill="#194f4c">2 → node 2</text><path d="M220 158 H270 M260 148 L273 158 L260 168" stroke="#6d9f93" stroke-width="4" fill="none"/><text x="470" y="82" text-anchor="middle" font-size="16" fill="#2b6a64">DOUBLY LINKED LIST</text><rect x="280" y="126" width="96" height="64" rx="8" fill="#f7faf7" stroke="#86aaa0"/><text x="328" y="164" text-anchor="middle" font-size="15" fill="#204e4c">HEAD</text><rect x="385" y="126" width="96" height="64" rx="8" fill="#b6ddd0" stroke="#86aaa0"/><text x="433" y="164" text-anchor="middle" font-size="15" fill="#204e4c">2 · MRU</text><rect x="490" y="126" width="96" height="64" rx="8" fill="#f1d1b7" stroke="#86aaa0"/><text x="538" y="164" text-anchor="middle" font-size="15" fill="#204e4c">1 · LRU</text><rect x="595" y="126" width="96" height="64" rx="8" fill="#f7faf7" stroke="#86aaa0"/><text x="643" y="164" text-anchor="middle" font-size="15" fill="#204e4c">TAIL</text><text x="470" y="231" text-anchor="middle" font-size="17" fill="#a15f3f">tail.prev 是淘汰端</text></svg>
