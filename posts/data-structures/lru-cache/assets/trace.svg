<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">146 LRU Cache trace</title><desc id="d">字典 nodes 将 key 映射到唯一链表节点；链表从 head.next 到 tail.prev 按最近使用程度从新到旧排列。head.next 是 MRU，tail.prev 是 LRU。每个真实节点在字典和链表中恰好出现一次。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="30" y="38" font-size="18" fill="#285e59">GET(1) · MOVE NODE TO MRU</text><text x="112" y="84" text-anchor="middle" font-size="15" fill="#98623f">BEFORE</text><text x="112" y="132" text-anchor="middle" font-size="21" fill="#235c57">HEAD → 2 → 1 → TAIL</text><path d="M350 130 H410 M398 119 L413 130 L398 141" stroke="#bf7954" stroke-width="4" fill="none"/><text x="540" y="84" text-anchor="middle" font-size="15" fill="#286d65">AFTER</text><text x="540" y="132" text-anchor="middle" font-size="21" fill="#235c57">HEAD → 1 → 2 → TAIL</text><text x="360" y="224" text-anchor="middle" font-size="17" fill="#98623f">put(3,3) 后从尾部淘汰 key 2</text></svg>
