<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">146 LRU Cache pitfall</title><desc id="d">字典 nodes 将 key 映射到唯一链表节点；链表从 head.next 到 tail.prev 按最近使用程度从新到旧排列。head.next 是 MRU，tail.prev 是 LRU。每个真实节点在字典和链表中恰好出现一次。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="32" y="42" font-size="19" fill="#315e59">A SMALL CONDITION CAN BREAK THE INVARIANT</text><rect x="35" y="86" width="310" height="122" rx="13" fill="#fae7dd" stroke="#d9ad90"/><rect x="375" y="86" width="310" height="122" rx="13" fill="#d9eee4" stroke="#9dc4b4"/><text x="190" y="137" text-anchor="middle" font-size="21" fill="#9a503a" font-weight="bold">更新值但不移动节点</text><text x="530" y="137" text-anchor="middle" font-size="21" fill="#236b61" font-weight="bold">更新后移动到 MRU</text><text x="360" y="260" text-anchor="middle" font-size="16" fill="#58746e">先写清楚边界，再把条件放进代码</text></svg>
