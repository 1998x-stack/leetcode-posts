<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">前 K 个高频元素 · trace</title><desc id="desc">具体样例的关键步骤轨迹</desc><defs><style>.k{font:700 25px system-ui;fill:#203035}.small{font:16px system-ui;fill:#53676d}.node{fill:#eaf3f1;stroke:#147f80;stroke-width:2}.panel{fill:#f3f9f6;stroke:#dce8e4;stroke-width:2}.good{fill:#e6f5ee;stroke:#23835c;stroke-width:2}.bad{fill:#fff0ec;stroke:#cf735b;stroke-width:2}.badText{font:700 18px system-ui;fill:#b54b34}.answer{font:700 22px system-ui;fill:#147f80}.line{stroke:#147f80;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="480" rx="24" fill="#fffdf9"/><text x="80" y="80" class="k">nums = [1,1,1,2,2,3], k = 2</text><g transform="translate(80 135)"><rect width="800" height="82" rx="16" class="panel"/><text x="28" y="34" class="small">频次</text><text x="180" y="58" class="k">1 → 3</text><text x="400" y="58" class="k">2 → 2</text><text x="620" y="58" class="k">3 → 1</text></g><path d="M160 270 H800" class="line"/><g transform="translate(250 300)"><rect width="460" height="90" rx="16" class="good"/><text x="230" y="36" text-anchor="middle" class="small">堆只保留两个最高频候选</text><text x="230" y="70" text-anchor="middle" class="answer">答案：[1, 2]</text></g></svg>