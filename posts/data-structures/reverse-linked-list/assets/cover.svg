<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">反转链表 · cover</title><desc id="desc">算法核心机制示意图</desc><defs><style>.k{font:700 25px system-ui;fill:#203035}.small{font:16px system-ui;fill:#53676d}.node{fill:#eaf3f1;stroke:#147f80;stroke-width:2}.panel{fill:#f3f9f6;stroke:#dce8e4;stroke-width:2}.good{fill:#e6f5ee;stroke:#23835c;stroke-width:2}.bad{fill:#fff0ec;stroke:#cf735b;stroke-width:2}.badText{font:700 18px system-ui;fill:#b54b34}.answer{font:700 22px system-ui;fill:#147f80}.line{stroke:#147f80;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="480" rx="24" fill="#fffdf9"/><text x="80" y="90" class="k">每一步只改写当前节点的 next</text><g transform="translate(100 155)"><rect x="0" y="30" width="105" height="64" rx="12" class="node"/><text x="52" y="70" text-anchor="middle" class="k">1</text><path d="M105 62 h78" class="line"/><path d="M168 52 l15 10 -15 10" class="line"/><rect x="190" y="30" width="105" height="64" rx="12" class="node"/><text x="242" y="70" text-anchor="middle" class="k">2</text><path d="M295 62 h78" class="line"/><path d="M358 52 l15 10 -15 10" class="line"/><rect x="380" y="30" width="105" height="64" rx="12" class="node"/><text x="432" y="70" text-anchor="middle" class="k">3</text><path d="M485 62 h78" class="line"/><path d="M548 52 l15 10 -15 10" class="line"/><rect x="570" y="30" width="105" height="64" rx="12" class="node"/><text x="622" y="70" text-anchor="middle" class="k">4</text></g><path d="M820 310 H150" class="line"/><text x="480" y="370" text-anchor="middle" class="answer">反转后：4 → 3 → 2 → 1 → None</text></svg>