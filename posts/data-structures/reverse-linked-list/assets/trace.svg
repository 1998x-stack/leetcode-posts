<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">反转链表 · trace</title><desc id="desc">具体样例的关键步骤轨迹</desc><defs><style>.k{font:700 25px system-ui;fill:#203035}.small{font:16px system-ui;fill:#53676d}.node{fill:#eaf3f1;stroke:#147f80;stroke-width:2}.panel{fill:#f3f9f6;stroke:#dce8e4;stroke-width:2}.good{fill:#e6f5ee;stroke:#23835c;stroke-width:2}.bad{fill:#fff0ec;stroke:#cf735b;stroke-width:2}.badText{font:700 18px system-ui;fill:#b54b34}.answer{font:700 22px system-ui;fill:#147f80}.line{stroke:#147f80;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="480" rx="24" fill="#fffdf9"/><text x="80" y="75" class="k">prev / curr / next 三个引用</text><g transform="translate(100 145)"><rect x="0" y="30" width="160" height="90" rx="14" class="good"/><text x="80" y="65" text-anchor="middle">prev = 1</text><text x="80" y="95" text-anchor="middle" class="small">已反转部分</text><rect x="270" y="30" width="160" height="90" rx="14" class="node"/><text x="350" y="65" text-anchor="middle">curr = 2</text><text x="350" y="95" text-anchor="middle" class="small">当前节点</text><rect x="540" y="30" width="160" height="90" rx="14" class="panel"/><text x="620" y="65" text-anchor="middle">next = 3</text><text x="620" y="95" text-anchor="middle" class="small">先保存后继</text><path d="M160 75 H270 M430 75 H540" class="line"/></g><text x="480" y="355" text-anchor="middle" class="answer">curr.next = prev；然后整体前进一格</text></svg>