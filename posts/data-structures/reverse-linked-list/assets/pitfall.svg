<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">反转链表的指针覆盖陷阱</title><desc id="desc">比较先保存后继节点与直接覆盖 next 指针的差别</desc><defs><style>.k{font:700 25px system-ui;fill:#203035}.bad{fill:#fff0ec;stroke:#cf735b;stroke-width:2}.good{fill:#e6f5ee;stroke:#23835c;stroke-width:2}.badText{font:700 18px system-ui;fill:#b54b34}.answer{font:700 22px system-ui;fill:#147f80}</style></defs><rect width="960" height="480" rx="24" fill="#fffdf9"/><rect x="80" y="95" width="370" height="230" rx="18" class="bad"/><text x="265" y="145" text-anchor="middle" class="k">错误：先覆盖 curr.next</text><text x="265" y="215" text-anchor="middle">2.next = 1</text><text x="265" y="275" text-anchor="middle" class="badText">原来的 3 丢失，链表断开</text><rect x="510" y="95" width="370" height="230" rx="18" class="good"/><text x="695" y="145" text-anchor="middle" class="k">正确：先保存 next</text><text x="695" y="215" text-anchor="middle">next = curr.next</text><text x="695" y="275" text-anchor="middle" class="answer">再反转指针，链路不丢失</text></svg>