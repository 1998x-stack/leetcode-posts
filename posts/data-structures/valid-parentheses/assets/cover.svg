<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">有效的括号 · cover</title><desc id="desc">算法核心机制示意图</desc><defs><style>.k{font:700 25px system-ui;fill:#203035}.small{font:16px system-ui;fill:#53676d}.node{fill:#eaf3f1;stroke:#147f80;stroke-width:2}.panel{fill:#f3f9f6;stroke:#dce8e4;stroke-width:2}.good{fill:#e6f5ee;stroke:#23835c;stroke-width:2}.bad{fill:#fff0ec;stroke:#cf735b;stroke-width:2}.badText{font:700 18px system-ui;fill:#b54b34}.answer{font:700 22px system-ui;fill:#147f80}.line{stroke:#147f80;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="480" rx="24" fill="#fffdf9"/><text x="80" y="90" class="k">栈只保存尚未匹配的左括号</text><g transform="translate(110 145)"><rect width="300" height="240" rx="18" class="panel"/><text x="150" y="38" text-anchor="middle" class="k">stack</text><rect x="70" y="65" width="160" height="38" rx="9" class="node"/><text x="150" y="91" text-anchor="middle">(</text><rect x="70" y="113" width="160" height="38" rx="9" class="node"/><text x="150" y="139" text-anchor="middle">[</text><rect x="70" y="161" width="160" height="38" rx="9" class="node"/><text x="150" y="187" text-anchor="middle">{</text></g><path d="M455 260 H535" class="line"/><g transform="translate(570 160)"><rect width="280" height="180" rx="18" class="good"/><text x="140" y="48" text-anchor="middle" class="k">遇到右括号</text><text x="140" y="95" text-anchor="middle">必须匹配栈顶</text><text x="140" y="145" text-anchor="middle" class="answer">匹配后弹出</text></g></svg>