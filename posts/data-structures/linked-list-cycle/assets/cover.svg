<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Floyd 快慢指针</title><desc id="d">fast 每轮走两步，slow 每轮走一步。</desc><rect width="900" height="360" rx="20" fill="#fffdf9"/><text x="40" y="52" font-size="27" font-weight="700" fill="#203035">Floyd 快慢指针</text><rect x="40" y="85" width="820" height="58" rx="10" fill="#d8eee6" stroke="#dce8e4"/><text x="65" y="120" font-size="19" fill="#203035">slow: 1 step / round</text><rect x="40" y="163" width="820" height="58" rx="10" fill="#f9e5d7" stroke="#dce8e4"/><text x="65" y="198" font-size="19" fill="#203035">fast: 2 steps / round</text><rect x="40" y="241" width="820" height="58" rx="10" fill="#d8eee6" stroke="#dce8e4"/><text x="65" y="276" font-size="19" fill="#203035">inside cycle: relative gap changes by 1 mod C</text></svg>