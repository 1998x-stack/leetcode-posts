<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">739 Daily Temperatures pitfall</title><desc id="d">栈保存尚未找到更暖日期的下标，从底到顶对应温度单调不增。当前温度严格高于栈顶温度时，当前下标就是栈顶等待的第一个更暖日；相等温度不能弹出。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="32" y="42" font-size="19" fill="#315e59">A SMALL CONDITION CAN BREAK THE INVARIANT</text><rect x="35" y="86" width="310" height="122" rx="13" fill="#fae7dd" stroke="#d9ad90"/><rect x="375" y="86" width="310" height="122" rx="13" fill="#d9eee4" stroke="#9dc4b4"/><text x="190" y="137" text-anchor="middle" font-size="21" fill="#9a503a" font-weight="bold">相等也弹栈（&gt;=）</text><text x="530" y="137" text-anchor="middle" font-size="21" fill="#236b61" font-weight="bold">严格更高才弹栈（&gt;）</text><text x="360" y="260" text-anchor="middle" font-size="16" fill="#58746e">先写清楚边界，再把条件放进代码</text></svg>
