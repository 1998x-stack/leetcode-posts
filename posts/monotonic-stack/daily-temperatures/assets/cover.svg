<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">739 Daily Temperatures cover</title><desc id="d">栈保存尚未找到更暖日期的下标，从底到顶对应温度单调不增。当前温度严格高于栈顶温度时，当前下标就是栈顶等待的第一个更暖日；相等温度不能弹出。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="32" y="38" font-size="17" fill="#356d6b">MONOTONIC STACK · WAITING DAYS</text><path d="M90 242 H630" stroke="#8baea4" stroke-width="3"/><rect x="130" y="167" width="92" height="75" rx="8" fill="#b6d9ce" stroke="#86aaa0"/><text x="176" y="265" text-anchor="middle" font-size="15" fill="#355f59">75° · index 2</text><rect x="280" y="170" width="92" height="72" rx="8" fill="#b6d9ce" stroke="#86aaa0"/><text x="326" y="265" text-anchor="middle" font-size="15" fill="#355f59">72° · index 5</text><rect x="430" y="173" width="92" height="69" rx="8" fill="#e9c6a9" stroke="#86aaa0"/><text x="476" y="265" text-anchor="middle" font-size="15" fill="#355f59">69° · index 4</text><text x="570" y="58" text-anchor="middle" font-size="20" fill="#a15d3c">76°</text><path d="M570 70 V112 M570 112 L555 96 M570 112 L585 96" fill="none" stroke="#bf7651" stroke-width="4"/></svg>
