<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">739 Daily Temperatures trace</title><desc id="d">栈保存尚未找到更暖日期的下标，从底到顶对应温度单调不增。当前温度严格高于栈顶温度时，当前下标就是栈顶等待的第一个更暖日；相等温度不能弹出。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="30" y="38" font-size="18" fill="#285e59">CURRENT DAY = 72° · RESOLVE THE STACK TOP</text><rect x="92" y="105" width="150" height="124" rx="12" fill="#e0eee7" stroke="#94b7aa"/><text x="167" y="132" text-anchor="middle" font-size="16" fill="#286d65">WAITING STACK</text><text x="167" y="169" text-anchor="middle" font-size="21" fill="#235c57">75° @ 2</text><text x="167" y="202" text-anchor="middle" font-size="21" fill="#235c57">72° @ 5</text><path d="M265 166 H395 M382 155 L397 166 L382 177" stroke="#bf7954" stroke-width="4" fill="none"/><rect x="420" y="105" width="205" height="124" rx="12" fill="#f6e6d8" stroke="#d7aa88"/><text x="522" y="145" text-anchor="middle" font-size="22" fill="#a15f3f">76° @ 6</text><text x="522" y="180" text-anchor="middle" font-size="16" fill="#805a43">pop 5 → wait 1</text><text x="522" y="207" text-anchor="middle" font-size="16" fill="#805a43">pop 2 → wait 4</text></svg>
