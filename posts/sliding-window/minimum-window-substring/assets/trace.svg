<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">最小覆盖窗口</title><desc id="d">先扩张直到覆盖，再收缩左端寻找更短窗口。</desc><rect width="900" height="360" rx="20" fill="#fffdf9"/><text x="40" y="52" font-size="27" font-weight="700" fill="#203035">最小覆盖窗口</text><rect x="40" y="85" width="820" height="58" rx="10" fill="#d8eee6" stroke="#dce8e4"/><text x="65" y="120" font-size="19" fill="#203035">expand right until A, B, C are all present</text><rect x="40" y="163" width="820" height="58" rx="10" fill="#f9e5d7" stroke="#dce8e4"/><text x="65" y="198" font-size="19" fill="#203035">record a valid window when missing == 0</text><rect x="40" y="241" width="820" height="58" rx="10" fill="#d8eee6" stroke="#dce8e4"/><text x="65" y="276" font-size="19" fill="#203035">shrink left while coverage remains</text><rect x="40" y="319" width="820" height="58" rx="10" fill="#f9e5d7" stroke="#dce8e4"/><text x="65" y="354" font-size="19" fill="#203035">BANC is the shortest valid window</text></svg>