<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">目标字符缺口</title><desc id="d">need[c] > 0: missing; need[c] = 0: exact; need[c] < 0: extra</desc><rect width="900" height="360" rx="20" fill="#fffdf9"/><text x="40" y="52" font-size="27" font-weight="700" fill="#203035">目标字符缺口</text><rect x="40" y="85" width="820" height="58" rx="10" fill="#d8eee6" stroke="#dce8e4"/><text x="65" y="120" font-size="19" fill="#203035">target ABC: need A=1, B=1, C=1</text><rect x="40" y="163" width="820" height="58" rx="10" fill="#f9e5d7" stroke="#dce8e4"/><text x="65" y="198" font-size="19" fill="#203035">add A/B/C: missing falls from 3 to 0</text><rect x="40" y="241" width="820" height="58" rx="10" fill="#d8eee6" stroke="#dce8e4"/><text x="65" y="276" font-size="19" fill="#203035">only missing == 0 means the window covers t</text></svg>