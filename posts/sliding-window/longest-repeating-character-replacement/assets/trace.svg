<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">窗口合法性修复</title><desc id="d">扩展右边界，预算超出时移动左边界。</desc><rect width="900" height="360" rx="20" fill="#fffdf9"/><text x="40" y="52" font-size="27" font-weight="700" fill="#203035">窗口合法性修复</text><rect x="40" y="85" width="820" height="58" rx="10" fill="#d8eee6" stroke="#dce8e4"/><text x="65" y="120" font-size="19" fill="#203035">right adds a character and updates frequency</text><rect x="40" y="163" width="820" height="58" rx="10" fill="#f9e5d7" stroke="#dce8e4"/><text x="65" y="198" font-size="19" fill="#203035">if length - max_freq > k, move left</text><rect x="40" y="241" width="820" height="58" rx="10" fill="#d8eee6" stroke="#dce8e4"/><text x="65" y="276" font-size="19" fill="#203035">recompute exact max frequency over 26 letters</text></svg>