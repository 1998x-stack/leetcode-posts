<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">3 常见错误及正确不变量</title><desc id="d">对于 &quot;abba&quot;，处理最后一个 a 时，旧 a 位于窗口左侧。错误写法 left=last_seen[a]+1 会从 2 回退到 1，造成含两个 b 的假窗口；正确写法是取 max(left,旧位置+1)。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="33" y="48" font-size="20" fill="#315e59" font-weight="bold">对照：哪一步会破坏不变量？</text><rect x="38" y="84" width="300" height="132" rx="14" fill="#fae8dd" stroke="#deae8c"/><rect x="382" y="84" width="300" height="132" rx="14" fill="#d7ede3" stroke="#9fc8b6"/><text x="188" y="143" text-anchor="middle" fill="#9a503a" font-size="21" font-weight="bold">错误：left 会回退</text><text x="532" y="143" text-anchor="middle" fill="#236c61" font-size="21" font-weight="bold">正确：left=max(...)</text><text x="360" y="263" font-size="15" text-anchor="middle" fill="#56746f">理解错误状态，才能知道优化为何成立</text></svg>
