<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">滑动窗口遇到重复字符时的边界跳跃</title><desc id="d">每轮处理完下标 right 后，闭区间 [left, right] 中所有字符互不重复；left 只会向右移动，且窗口是以 right 为结尾的最长合法窗口。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="36" y="45" font-size="17" fill="#356d6b" font-weight="bold">WINDOW · 无重复子串</text><rect x="45" y="95" width="62" height="68" rx="10" fill="#b9e0d2" stroke="#84b3a6"/><text x="76" y="137" font-size="29" text-anchor="middle" fill="#173f45">a</text><rect x="122" y="95" width="62" height="68" rx="10" fill="#b9e0d2" stroke="#84b3a6"/><text x="153" y="137" font-size="29" text-anchor="middle" fill="#173f45">b</text><rect x="199" y="95" width="62" height="68" rx="10" fill="#b9e0d2" stroke="#84b3a6"/><text x="230" y="137" font-size="29" text-anchor="middle" fill="#173f45">c</text><rect x="276" y="95" width="62" height="68" rx="10" fill="#f4c5a9" stroke="#84b3a6"/><text x="307" y="137" font-size="29" text-anchor="middle" fill="#173f45">a</text><rect x="353" y="95" width="62" height="68" rx="10" fill="#dfe9e5" stroke="#84b3a6"/><text x="384" y="137" font-size="29" text-anchor="middle" fill="#173f45">b</text><rect x="430" y="95" width="62" height="68" rx="10" fill="#dfe9e5" stroke="#84b3a6"/><text x="461" y="137" font-size="29" text-anchor="middle" fill="#173f45">c</text><rect x="507" y="95" width="62" height="68" rx="10" fill="#dfe9e5" stroke="#84b3a6"/><text x="538" y="137" font-size="29" text-anchor="middle" fill="#173f45">b</text><rect x="584" y="95" width="62" height="68" rx="10" fill="#dfe9e5" stroke="#84b3a6"/><text x="615" y="137" font-size="29" text-anchor="middle" fill="#173f45">b</text><path d="M45 192 H246" stroke="#19756f" stroke-width="5"/><path d="M276 192 V213 H354 V192" fill="none" stroke="#ca7650" stroke-width="4"/><text x="147" y="226" font-size="19" text-anchor="middle" fill="#19756f">合法窗口 abc</text><text x="320" y="243" font-size="16" text-anchor="middle" fill="#a2533