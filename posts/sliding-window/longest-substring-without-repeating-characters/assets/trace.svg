<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 720 300"><title id="t">3 关键状态转移</title><desc id="d">记录每个字符上一次出现的下标 last_seen[c]。若它在当前窗口内出现（位置 ≥ left），将 left 跳到其后；若上一次出现的位置早于 left，就不必移动。更新最优长度 right-left+1。</desc><rect width="720" height="300" rx="18" fill="#f0f6f0"/><text x="36" y="46" font-size="20" font-weight="bold" fill="#235f5e">状态转移：从当前决策到下一步</text><rect x="48" y="99" width="128" height="65" rx="12" fill="#d2e8dc" stroke="#92b4ac"/><text x="112" y="139" font-size="21" text-anchor="middle" fill="#204f50">a</text><rect x="191" y="99" width="128" height="65" rx="12" fill="#d2e8dc" stroke="#92b4ac"/><text x="255" y="139" font-size="21" text-anchor="middle" fill="#204f50">b</text><rect x="334" y="99" width="128" height="65" rx="12" fill="#d2e8dc" stroke="#92b4ac"/><text x="398" y="139" font-size="21" text-anchor="middle" fill="#204f50">c</text><path d="M320 200 H420" stroke="#bd7855" stroke-width="4"/><path d="M418 190 l17 10 -17 10" fill="none" stroke="#bd7855" stroke-width="4"/><text x="360" y="250" font-size="18" text-anchor="middle" fill="#98613b">重复 a 后左边界右移</text></svg>
